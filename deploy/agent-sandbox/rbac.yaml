apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anvild-agent-sandbox
rules:
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, create, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
