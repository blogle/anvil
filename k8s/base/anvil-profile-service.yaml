apiVersion: v1
kind: Service
metadata:
  name: anvil-profile
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anvil-profile
  ports:
    - name: opencode
      port: 4096
      targetPort: opencode
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anvil-profile
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: anvil-profile
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: anvild
      ports:
        - protocol: TCP
          port: 4096
