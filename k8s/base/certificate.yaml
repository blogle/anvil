apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: preview-thejeffer-net-tls
spec:
  commonName: '*.preview.thejeffer.net'
  dnsNames:
    - '*.preview.thejeffer.net'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
  privateKey:
    algorithm: RSA
    size: 2048
  renewBefore: 360h
  secretName: preview-thejeffer-net-tls
