apiVersion: v1
kind: ConfigMap
metadata:
  name: anvil-runtime
data:
  ANVIL_NAMESPACE: anvil
  ANVIL_BIND_PORT: "8080"
  ANVIL_SANDBOX_IMAGE: ghcr.io/blogle/anvil-sandbox:main
  ANVIL_WORKSPACE_SIZE: 20Gi
  ANVIL_PROVISION_TIMEOUT: "180"
  ANVIL_PREVIEW_DOMAIN: preview.example.invalid
  ANVIL_ANNOTATION_PREFIX: anvil.example.invalid
  ANVIL_PROFILE_PVC: anvil-opencode-profile
  ANVIL_PROFILE_OPENCODE_URL: http://anvil-profile.anvil.svc.cluster.local:4096
  ANVIL_API_URL: http://anvild:8080
  BASE_DOMAIN: preview.example.invalid
  AGENT_SANDBOX_ROUTER_URL: http://sandbox-router-svc.agent-sandbox-system.svc.cluster.local:8080
  LISTEN_ADDR: 0.0.0.0:8082
  RUST_LOG: info
