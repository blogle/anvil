apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvild
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anvild
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvild
    spec:
      enableServiceLinks: false
      serviceAccountName: anvild
      containers:
        - name: anvild
          image: ghcr.io/blogle/anvil:main
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: anvil-runtime
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil-mcp
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: mcp
          image: ghcr.io/blogle/anvil:main
          imagePullPolicy: Always
          command: ["/bin/anvil-mcp"]
          envFrom:
            - configMapRef:
                name: anvil-runtime
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil-router
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: router
          image: ghcr.io/blogle/anvil:main
          imagePullPolicy: Always
          command: ["/bin/anvil-router"]
          envFrom:
            - configMapRef:
                name: anvil-runtime
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
