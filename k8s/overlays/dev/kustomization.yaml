apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: anvil/anvild
    newName: anvil/anvild
    newTag: dev
  - name: anvil/mcp
    newName: anvil/mcp
    newTag: dev
  - name: anvil/router
    newName: anvil/router
    newTag: dev
patches:
  - target:
      kind: Ingress
      name: anvil
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: '*.preview.thejeffer.net'
