apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Kind exercises exactly the same upstream manifests as production.
resources:
  - ../../base

images:
  - name: ghcr.io/blogle/anvil
    newTag: kind-e2e
  - name: ghcr.io/blogle/anvil-sandbox
    newTag: kind-e2e
  - name: ghcr.io/blogle/anvil-nix-daemon
    newTag: kind-e2e

patches:
  - target:
      kind: Deployment
      name: anvil-nix-daemon
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Deployment
      name: anvild|anvil-mcp|anvil-router|anvil-profile
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: CronJob
      name: anvil-nix-gc
    patch: |-
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: ConfigMap
      name: anvil-runtime
    patch: |-
      - op: replace
        path: /data/ANVIL_SANDBOX_IMAGE
        value: ghcr.io/blogle/anvil-sandbox:kind-e2e
      - op: replace
        path: /data/ANVIL_PREVIEW_DOMAIN
        value: preview.kind.test
      - op: replace
        path: /data/ANVIL_ANNOTATION_PREFIX
        value: anvil.example
      - op: replace
        path: /data/AGENT_SANDBOX_ROUTER_URL
        value: http://anvild.anvil.svc.cluster.local:8080
      - op: replace
        path: /data/BASE_DOMAIN
        value: preview.kind.test
