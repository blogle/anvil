name: Local-first E2E harness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: PR admission
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.head_ref, 'mergify/merge-queue/')
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate flake
        run: time nix flake check --no-build
      - name: Rust format
        run: time nix develop --command cargo fmt --all --check

  integration:
    name: Integration E2E
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      startsWith(github.head_ref, 'mergify/merge-queue/')
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rust checks
        run: time nix develop --command just check
      - name: Deterministic process E2E (repeat for determinism)
        run: |
          time nix develop --command just e2e
          time nix develop --command just e2e
      - name: Actual sandbox OCI acceptance
        run: time nix develop --command just e2e-sandbox-image
