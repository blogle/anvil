name: SDLC policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    uses: blogle/sdlc/.github/workflows/policy-check.yml@1bd4d95a9253f09fa67e486f4b834a7ff8c20cd9

  gate:
    name: sdlc / policy
    if: always()
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: blogle/sdlc/actions/status-gate@1bd4d95a9253f09fa67e486f4b834a7ff8c20cd9
        with:
          result: ${{ needs.policy.result }}
          stage: policy
