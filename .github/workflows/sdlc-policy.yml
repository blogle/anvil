name: SDLC policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    uses: blogle/sdlc/.github/workflows/policy-check.yml@892bbbf6bc27dc2c21968e0f7b1d4feb25ad51db

  gate:
    name: sdlc / policy
    if: always()
    needs: policy
    runs-on: ubuntu-latest
    steps:
      - uses: blogle/sdlc/actions/status-gate@892bbbf6bc27dc2c21968e0f7b1d4feb25ad51db
        with:
          result: ${{ needs.policy.result }}
          stage: policy
