name: Build and publish images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Render Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and check image contract
        run: |
          set -euo pipefail
          kubectl kustomize k8s/overlays/dev > /tmp/anvil-rendered.yaml
          if grep -En 'image: (anvil(:|/)|anvil-sandbox:)|imagePullPolicy: Never' /tmp/anvil-rendered.yaml; then
            echo 'rendered manifests contain a local image or Never pull policy'
            exit 1
          fi
          grep -En 'image: ghcr.io/blogle/anvil:main' /tmp/anvil-rendered.yaml
          grep -En 'image: ghcr.io/blogle/anvil-sandbox:main' /tmp/anvil-rendered.yaml
          grep -En 'ANVIL_SANDBOX_IMAGE: ghcr.io/blogle/anvil-sandbox:main' /tmp/anvil-rendered.yaml

  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build OCI archives
        run: |
          nix build .#anvil-image -o result-anvil
          nix build .#anvil-sandbox-image -o result-anvil-sandbox
          docker load < result-anvil
          docker load < result-anvil-sandbox
          docker image inspect anvil:dev >/dev/null
          docker image inspect anvil-sandbox:dev >/dev/null
          docker save anvil:dev anvil-sandbox:dev -o anvil-images.tar
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-images
          path: anvil-images.tar
          compression-level: 0

  publish:
    name: Publish images
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anvil-images
      - name: Load images
        run: docker load -i anvil-images.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-${GITHUB_SHA}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=(main latest)
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags+=("${GITHUB_REF_NAME}")
          fi
          for image in anvil anvil-sandbox; do
            if [[ "${image}" == anvil ]]; then
              target="${prefix}"
            else
              target="ghcr.io/${owner,,}/anvil-sandbox"
            fi
            for tag in "${tags[@]}"; do
              docker tag "${image}:dev" "${target}:${tag}"
              docker push "${target}:${tag}"
            done
          done
      - name: Make GHCR packages public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PATCH user/packages/container/anvil --field visibility=public
          gh api --method PATCH user/packages/container/anvil-sandbox --field visibility=public
