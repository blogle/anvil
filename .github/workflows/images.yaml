name: Build and publish images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Render Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and check image contract
        run: |
          set -euo pipefail
          kubectl kustomize k8s/overlays/dev > /tmp/anvil-rendered.yaml
          if grep -En 'image: (anvil(:|/)|anvil-sandbox:)|imagePullPolicy: Never' /tmp/anvil-rendered.yaml; then
            echo 'rendered manifests contain a local image or Never pull policy'
            exit 1
          fi
          grep -En 'image: ghcr.io/blogle/anvil:main' /tmp/anvil-rendered.yaml
          grep -En 'image: ghcr.io/blogle/anvil-sandbox:main' /tmp/anvil-rendered.yaml
          grep -En 'ANVIL_SANDBOX_IMAGE: ghcr.io/blogle/anvil-sandbox:main' /tmp/anvil-rendered.yaml

  pr-build:
    name: Build and inspect PR images
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Run Nix checks
        run: nix flake check
      - name: Build and inspect PR images
        run: |
          nix build .#anvil-image-ci -o result-anvil-ci
          docker load < result-anvil-ci
          nix run .#anvil-sandbox-image.copyToDockerDaemon
          docker image inspect anvil-ci:dev >/dev/null
          docker image inspect ghcr.io/blogle/anvil-sandbox:main >/dev/null

  publish:
    name: Build, inspect, and publish images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Run Nix checks
        run: nix flake check
      - name: Build production images
        run: |
          nix build .#anvil-image -o result-anvil
          docker load < result-anvil
          nix run .#anvil-sandbox-image.copyToDockerDaemon
          docker image inspect anvil:dev >/dev/null
          docker image inspect ghcr.io/blogle/anvil-sandbox:main >/dev/null
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-${GITHUB_SHA}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=(main latest)
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags+=("${GITHUB_REF_NAME}")
          fi
          for image in anvil anvil-sandbox; do
            if [[ "${image}" == anvil ]]; then
              target="${prefix}"
              source="anvil:dev"
            else
              target="ghcr.io/${owner,,}/anvil-sandbox"
              source="ghcr.io/${owner,,}/anvil-sandbox:main"
            fi
            for tag in "${tags[@]}"; do
              docker tag "${source}" "${target}:${tag}"
              docker push "${target}:${tag}"
            done
          done
