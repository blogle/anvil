name: Build and publish images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Render Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and check image contract
        run: |
          set -euo pipefail
          start=$SECONDS
          kubectl kustomize k8s/overlays/dev > /tmp/anvil-rendered.yaml
          if grep -En 'image: (anvil(:|/)|anvil-sandbox:|anvil-nix-daemon:)|imagePullPolicy: Never' /tmp/anvil-rendered.yaml; then
            echo 'rendered manifests contain a local image or Never pull policy'
            exit 1
          fi
          grep -En 'image: ghcr.io/blogle/anvil:main' /tmp/anvil-rendered.yaml
          grep -En 'image: ghcr.io/blogle/anvil-sandbox:main' /tmp/anvil-rendered.yaml
          grep -En 'image: ghcr.io/blogle/anvil-nix-daemon:main' /tmp/anvil-rendered.yaml
          grep -En 'ANVIL_SANDBOX_IMAGE: ghcr.io/blogle/anvil-sandbox:main' /tmp/anvil-rendered.yaml
          grep -En 'ANVIL_NIX_PVC: anvil-nix' /tmp/anvil-rendered.yaml
          printf 'render-and-contract-seconds=%s\n' "$((SECONDS - start))"

  pr-artifacts:
    name: Build batch image artifacts
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Restore targeted Anvil image cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/anvil-image-cache
          key: ${{ runner.os }}-anvil-image-ci-${{ hashFiles('flake.lock', 'Cargo.lock') }}-${{ hashFiles('flake.nix', 'Cargo.toml', 'crates/**', 'web/**', 'nix/rust.nix', 'nix/images.nix') }}
          restore-keys: |
            ${{ runner.os }}-anvil-image-ci-${{ hashFiles('flake.lock', 'Cargo.lock') }}-
      - name: Report targeted image cache restore
        run: |
          printf 'anvil-image-cache-hit=%s\n' '${{ steps.restore.outputs.cache-hit }}'
      - name: Validate flake outputs
        run: time nix --option build-users-group "" flake check --no-build
      - name: Build OCI archives
        run: |
          set -euo pipefail
          mkdir -p image-artifacts paths
          : > image-build-timings.txt
          cache_dir="$RUNNER_TEMP/anvil-image-cache"
          mkdir -p "$cache_dir"
          if [ -s "$cache_dir/paths" ]; then
            cache_start=$SECONDS
            nix --option build-users-group "" copy --no-check-sigs --from "file://$cache_dir" $(<"$cache_dir/paths")
            printf 'anvil-cache-import-seconds=%s\n' "$((SECONDS - cache_start))" | tee -a image-build-timings.txt
          else
            printf '%s\n' 'anvil-cache-import-seconds=0 (miss)' | tee -a image-build-timings.txt
          fi
          build_root() {
            name="$1"
            output="$2"
            start=$SECONDS
            started_at="$(date -u +%FT%TZ)"
            printf '%s-start=%s\n' "$name" "$started_at"
            nix --option build-users-group "" build --no-link --print-out-paths "$output" > "paths/$name"
            ended_at="$(date -u +%FT%TZ)"
            printf '%s-end=%s\n' "$name" "$ended_at"
            printf '%s-seconds=%s\n' "$name" "$((SECONDS - start))"
            {
              printf '%s-start=%s\n' "$name" "$started_at"
              printf '%s-end=%s\n' "$name" "$ended_at"
              printf '%s-seconds=%s\n' "$name" "$((SECONDS - start))"
            } >> image-build-timings.txt
          }
          build_root anvil .#anvil-image-ci & anvil_pid=$!
          build_root sandbox .#anvil-sandbox-image & sandbox_pid=$!
          build_root daemon .#anvil-nix-daemon-image & daemon_pid=$!
          build_root upgrade .#anvil-nix-daemon-upgrade-test-image & upgrade_pid=$!
          build_failed=0
          for pid in "$anvil_pid" "$sandbox_pid" "$daemon_pid" "$upgrade_pid"; do
            wait "$pid" || build_failed=1
          done
          if [ "$build_failed" -ne 0 ]; then
            echo 'one or more OCI image builds failed; skipping image conversion' >&2
            exit 1
          fi
          for name in anvil sandbox daemon upgrade; do
            if [ ! -s "paths/$name" ]; then
              echo "image build produced no output path: $name" >&2
              exit 1
            fi
          done

          convert_image() {
            name="$1"
            source="$2"
            target="$3"
            start=$SECONDS
            started_at="$(date -u +%FT%TZ)"
            printf '%s-convert-start=%s\n' "$name" "$started_at"
            nix develop .#kind-ci --command skopeo --insecure-policy copy "$source" "$target"
            ended_at="$(date -u +%FT%TZ)"
            printf '%s-convert-end=%s\n' "$name" "$ended_at"
            printf '%s-convert-seconds=%s\n' "$name" "$((SECONDS - start))"
            {
              printf '%s-convert-start=%s\n' "$name" "$started_at"
              printf '%s-convert-end=%s\n' "$name" "$ended_at"
              printf '%s-convert-seconds=%s\n' "$name" "$((SECONDS - start))"
            } >> image-build-timings.txt
          }
          convert_image anvil "docker-archive:$(<paths/anvil)" docker-archive:image-artifacts/anvil-image.tar:ghcr.io/blogle/anvil:kind-e2e
          convert_image sandbox "nix:$(<paths/sandbox)" docker-archive:image-artifacts/anvil-sandbox-image.tar:ghcr.io/blogle/anvil-sandbox:kind-e2e
          convert_image daemon "nix:$(<paths/daemon)" docker-archive:image-artifacts/anvil-nix-daemon-image.tar:ghcr.io/blogle/anvil-nix-daemon:kind-e2e
          convert_image upgrade "nix:$(<paths/upgrade)" docker-archive:image-artifacts/anvil-nix-daemon-upgrade-test-image.tar:ghcr.io/blogle/anvil-nix-daemon:kind-upgrade

          (cd image-artifacts && sha256sum *.tar > SHA256SUMS)
          nix develop .#kind-ci --command bash -c '
            set -euo pipefail
            cd image-artifacts
            sha256sum -c SHA256SUMS
            for spec in \
              "anvil-image.tar ghcr.io/blogle/anvil:kind-e2e" \
              "anvil-sandbox-image.tar ghcr.io/blogle/anvil-sandbox:kind-e2e" \
              "anvil-nix-daemon-image.tar ghcr.io/blogle/anvil-nix-daemon:kind-e2e" \
              "anvil-nix-daemon-upgrade-test-image.tar ghcr.io/blogle/anvil-nix-daemon:kind-upgrade"; do
              archive="${spec%% *}"
              image="${spec#* }"
              actual="$(skopeo inspect --insecure-policy --format "{{.Name}}@{{.Digest}}" "docker-archive:$archive")"
              test "$actual" != ""
              printf "%s %s\n" "$image" "$actual"
            done
          ' | tee image-report.txt
          docker load < image-artifacts/anvil-nix-daemon-image.tar
          nix develop .#kind-ci --command bash tests/nix-daemon-smoke.sh ghcr.io/blogle/anvil-nix-daemon:kind-e2e
          cache_export_start=$SECONDS
          nix --option build-users-group "" path-info --recursive \
            .#anvil-image-ci .#anvil-ci-release-cargo-artifacts > "$cache_dir/paths.new"
          cache_nar_bytes="$(nix --option build-users-group "" path-info --json --recursive \
            .#anvil-image-ci .#anvil-ci-release-cargo-artifacts \
            | jq '[.[] | .narSize] | add // 0')"
          printf 'anvil-cache-nar-bytes=%s\n' "$cache_nar_bytes" | tee -a image-build-timings.txt
          if [ "$cache_nar_bytes" -le 2147483648 ]; then
            nix --option build-users-group "" copy --no-check-sigs --to "file://$cache_dir" $(<"$cache_dir/paths.new")
            mv "$cache_dir/paths.new" "$cache_dir/paths"
          else
            rm -rf "$cache_dir"
            printf '%s\n' 'anvil-cache-export=skipped (over 2 GiB bound)' | tee -a image-build-timings.txt
          fi
          printf 'anvil-cache-export-seconds=%s\n' "$((SECONDS - cache_export_start))" | tee -a image-build-timings.txt
          (cd image-artifacts && sha256sum *.tar > SHA256SUMS)
      - name: Save targeted Anvil image cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/anvil-image-cache
          key: ${{ runner.os }}-anvil-image-ci-${{ hashFiles('flake.lock', 'Cargo.lock') }}-${{ hashFiles('flake.nix', 'Cargo.toml', 'crates/**', 'web/**', 'nix/rust.nix', 'nix/images.nix') }}
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-pr-image-archives
          path: image-artifacts
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: anvil-pr-image-report
          path: |
            image-report.txt
            image-build-timings.txt
          if-no-files-found: error

  pr-build:
    name: Build and inspect batch images
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')
    needs: pr-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anvil-pr-image-report
          path: image-report
      - name: Inspect producer archives
        run: |
          set -euo pipefail
          start=$SECONDS
          test -s image-report/image-report.txt
          grep -F 'ghcr.io/blogle/anvil:kind-e2e' image-report/image-report.txt
          grep -F 'ghcr.io/blogle/anvil-sandbox:kind-e2e' image-report/image-report.txt
          grep -F 'ghcr.io/blogle/anvil-nix-daemon:kind-e2e' image-report/image-report.txt
          grep -F 'ghcr.io/blogle/anvil-nix-daemon:kind-upgrade' image-report/image-report.txt
          test -s image-report/image-build-timings.txt
          printf 'archive-consume-seconds=%s\n' "$((SECONDS - start))"

  kind-fidelity:
    name: Isolated Agent Sandbox Kubernetes lane
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')
    needs: pr-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: anvil-pr-image-archives
          path: image-artifacts
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Isolated Agent Sandbox Kubernetes lane
        run: |
          time ANVIL_KIND_ARTIFACT_DIR="$GITHUB_WORKSPACE/image-artifacts" \
            nix develop .#kind-ci --command just e2e-k8s


  batch-image-gate:
    name: Batch image and Kind
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'mergify/merge-queue/')
    needs:
      - validate
      - pr-artifacts
      - pr-build
      - kind-fidelity
    runs-on: ubuntu-latest
    steps:
      - name: Require all batch image checks
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          ARTIFACTS_RESULT: ${{ needs.pr-artifacts.result }}
          INSPECT_RESULT: ${{ needs.pr-build.result }}
          KIND_RESULT: ${{ needs.kind-fidelity.result }}
        run: |
          set -euo pipefail
          test "$VALIDATE_RESULT" = success
          test "$ARTIFACTS_RESULT" = success
          test "$INSPECT_RESULT" = success
          test "$KIND_RESULT" = success

  publish:
    name: Build, inspect, and publish images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Run Nix checks
        run: time nix --option build-users-group "" flake check
      - name: Build production images
        run: |
          nix --option build-users-group "" build .#anvil-image -o result-anvil
          docker load < result-anvil
          nix --option build-users-group "" run .#anvil-sandbox-image.copyToDockerDaemon
          nix --option build-users-group "" run .#anvil-nix-daemon-image.copyToDockerDaemon
          docker image inspect anvil:dev >/dev/null
          docker image inspect ghcr.io/blogle/anvil-sandbox:main >/dev/null
          docker image inspect ghcr.io/blogle/anvil-nix-daemon:main >/dev/null
          nix develop .#kind-ci --command bash tests/nix-daemon-smoke.sh ghcr.io/blogle/anvil-nix-daemon:main
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-${GITHUB_SHA}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            tags+=(main latest)
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags+=("${GITHUB_REF_NAME}")
          fi
          for image in anvil anvil-sandbox anvil-nix-daemon; do
            if [[ "${image}" == anvil ]]; then
              target="${prefix}"
              source="anvil:dev"
            else
              target="ghcr.io/${owner,,}/${image}"
              source="${target}:main"
            fi
            for tag in "${tags[@]}"; do
              docker tag "${source}" "${target}:${tag}"
              docker push "${target}:${tag}"
            done
          done
