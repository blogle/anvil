name: SDLC release activation

# Deliberately manual and disabled by default during onboarding. The user
# must provision the release App and explicitly dispatch with activate=true.
on:
  workflow_dispatch:
    inputs:
      merged_sha:
        description: Exact squash-merged release commit on main
        required: true
        type: string
      activate:
        description: Explicitly activate publication after policy approval
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: inputs.activate == true
    uses: blogle/sdlc/.github/workflows/release-reconcile.yml@v1.2.4
    with:
      merged_sha: ${{ inputs.merged_sha }}
      activate: ${{ inputs.activate }}
      sdlc_ref: github:blogle/sdlc/v1.2.4
    secrets: inherit
