name: SDLC CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  pr-fast:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push'
    uses: blogle/sdlc/.github/workflows/pr-fast.yml@v1.3.0

  pr-fast-gate:
    name: sdlc / pr-fast
    if: always()
    needs: pr-fast
    runs-on: ubuntu-latest
    steps:
      - uses: blogle/sdlc/actions/status-gate@v1.3.0
        with:
          result: ${{ needs.pr-fast.result }}
          stage: pr-fast

  candidate:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: blogle/sdlc/.github/workflows/candidate.yml@v1.3.0

  candidate-gate:
    name: sdlc / candidate
    if: always()
    needs: candidate
    runs-on: ubuntu-latest
    steps:
      - uses: blogle/sdlc/actions/status-gate@v1.3.0
        with:
          result: ${{ needs.candidate.result }}
          stage: candidate
