  function overview(c){const campaign=campaignFor(c);return `<div class="panel decision-panel"><h3>Controller decision / next action</h3><strong>${esc(c.requested)}</strong><p class="muted">Current decision: ${esc(c.statusLabel)}. Commission authority and approved specification generation ${c.generation} remain in force.</p></div><div class="panel"><h3>Identity and context</h3><div class="context-grid">${contextCell('Commission',c.id)}${contextCell('Repository',c.repo)}${contextCell('Branch',c.branch)}${contextCell('Ticket',c.ticket)}${contextCell('Pull request',c.pr)}${contextCell('Candidate',c.candidate)}${contextCell('Specification generation',c.generation)}${contextCell('Time in state',c.since)}</div><div class="link-list"><span class="example-link">PR ${esc(c.pr)} · example, no live link</span><span class="example-link">Branch · example, no live URL</span><span class="example-link">Ticket ${esc(c.ticket)} · example, no live link</span><button class="btn" data-campaign="${campaign.id}">Parent Campaign · ${esc(campaign.title)}</button><a class="btn" href="spec.html#acceptance-obligations" target="_blank" rel="noopener">Specification</a><span class="example-link">Preview · no live URL supplied</span></div><p class="dim">Exact OpenCode Session: <code>${esc(c.session)}</code> · session link unavailable in this reference</p></div><div class="panel watchdog-panel ${c.status==='watchdog'?'alert':''}"><h3>Existing watchdog observations · ${esc(c.watchdog.fresh)}</h3><strong>${esc(c.watchdog.disposition)}</strong><p class="muted">${esc(c.watchdog.detail)}</p>${c.status==='watchdog'?'<p class="state alert">Outstanding decision · operator intervention requested</p>':''}<p class="dim">This panel exposes existing controller observations; it is not a separate liveness feature.</p></div>${renderDependencies(c)}<div class="panel"><h3>Delivery and deployment distinction</h3><span class="state ${stateClass(c)}">${esc(c.statusLabel)}</span>${c.release?`<p class="muted">Integration/release status: ${esc(c.release)}. Merge does not imply deployment.</p>`:'<p class="muted">No integration outcome is claimed by this mockup.</p>'}</div>`}
  function tabContent(c){if(model.tab==='overview')return overview(c);if(model.tab==='obligations')return `<div class="panel"><h3>Approved obligations · ${c.obligations} total</h3><p class="muted">Evidence dispositions are criterion- and Candidate-scoped. The count is not a percentage of implementation work.</p>${c.evidence.map(([name,proof,disposition])=>`<div class="data-row"><span><b>${esc(name)}</b><br>${esc(proof)}</span><span class="state">${esc(disposition)}</span></div>`).join('')}</div>`;if(model.tab==='diff')return `<div class="panel"><h3>Candidate ${esc(c.candidate)} · illustrative diff</h3><p class="muted">Example text only; no repository is connected.</p><pre class="diff">${esc(c.diff)}</pre><button class="btn" data-expand>Collapse workbench</button></div>`;if(model.tab==='activity')return `<div class="panel"><h3>Commission activity · sample</h3>${[...c.activity,...(model.actionMessages[c.key]||[])].map(x=>`<div class="data-row"><span>${esc(x)}</span><span class="dim">example</span></div>`).join('')}</div>`;return `<div class="panel"><h3>Attempts</h3><p class="muted">Agent conversation is not the default inspector content.</p>${c.attempts.map(x=>`<div class="data-row"><span>${esc(x)}</span><span class="example-link">Exact Session ID shown · no live link</span></div>`).join('')}</div>`}
  function actionFields(c){const k=document.getElementById('actionKind')?.value||'guidance',host=document.getElementById('actionSpecific');if(!host)return;if(k==='answer')host.innerHTML=c.question?`<div class="needs-question">Controller-admitted question: ${esc(c.question.prompt)}</div><label>Answer option<select id="questionChoice">${c.question.options.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`:'<p class="dim">No admitted structured question for this Commission.</p>';else if(k==='amendment')host.innerHTML='<label>Proposed specification generation<input id="amendGeneration" value="'+(c.generation+1)+'"></label><label>Rationale<textarea id="amendRationale" placeholder="State the requested versioned criterion change"></textarea></label>';else if(k==='intervention')host.innerHTML=`<div class="needs-question">${c.status==='watchdog'?'Existing watchdog observation: shell stall classification pending QA.':'Intervention request is a local mock only.'}</div><label>Intervention request<textarea id="interventionText" placeholder="Describe requested controller attention"></textarea></label>`;else if(k==='authorize')host.innerHTML=`<div class="callout">Review-ready Candidate ${esc(c.candidate)} · specification generation ${c.generation}</div><label>Candidate SHA<input id="authCandidate" value="${esc(c.candidate)}"></label><label>Specification generation<input id="authGeneration" value="${c.generation}"></label><label class="checkline"><input type="checkbox" id="authFresh"> I confirmed Candidate and specification generation are current</label><p class="dim">Stale Candidate or generation must be refreshed before this mock authorization can pass.</p>`;else host.innerHTML='<label>Implementation guidance<textarea id="guidanceText" placeholder="Guidance for the current Assignment (mock only)"></textarea></label>'}
  function renderCommand(c){if(!c)return '';return `<div class="panel mock-actions"><h3>Contextual actions · MOCK ONLY</h3><p class="dim">Local reference interactions only. Nothing is sent to Anvil, OpenCode, GitHub, or a provider.</p><form id="mockActionForm" class="mock-form"><label>Typed action<select id="actionKind"><option value="guidance">Queue implementation guidance</option><option value="answer">Answer admitted controller question</option><option value="amendment">Propose versioned specification amendment</option><option value="intervention">Request controller intervention</option><option value="authorize">Authorize integration</option></select></label><div id="actionSpecific"></div><button class="btn primary" type="submit">Simulate locally · no command sent</button></form><div class="notice" id="actionNotice" role="status">${esc(model.actionMessages[c.key]?.at(-1)||'MOCK ONLY — actions below update this reference screen only.')}</div></div>`}
  function campaignInspector(c){const delivered=c.commissions.filter(k=>isIntegrated(commissions[k])).length;return `<div class="panel"><h3>Campaign objective</h3><p>${esc(c.objective)}</p><span class="state">${delivered} delivered · ${c.commissions.length} required Commissions · sample</span><p class="muted">Delivery and Campaign acceptance are evaluated separately.</p></div><div class="panel"><h3>Commissions · flat list</h3>${c.commissions.map(k=>{const x=commissions[k];return `<div class="data-row"><button class="text-link" data-commission="${x.key}">${esc(x.title)}</button><span class="state ${stateClass(x)}">${esc(x.statusLabel)}</span></div>`}).join('')}</div><div class="panel"><h3>Many-to-many dependency relationships</h3>${c.commissions.map(k=>{const x=commissions[k],ins=waitingFor(k),outs=unlocks(k);if(!ins.length&&!outs.length)return '';return `<div class="dependency"><b>${esc(x.title)}</b>${ins.map(d=>`<div>Waiting for <button class="text-link" data-commission="${d.up}">${esc(commissions[d.up].title)}</button> · <span class="state ${stateClass(commissions[d.up])}">${esc(commissions[d.up].statusLabel)}</span> · execution ${esc(d.gate)} · ${esc(d.input)}</div>`).join('')}${outs.map(d=>`<div>Unlocks <button class="text-link" data-commission="${d.down}">${esc(commissions[d.down].title)}</button> · execution ${esc(d.gate)}</div>`).join('')}</div>`}).join('')||'<p class="muted">No dependency edges in this sample.</p>'}<div class="callout">Execution gates control implementation readiness. Required upstream delivery ordering remains enforced for integration.</div></div>`}
  function renderIdentity(c){const campaign=campaignFor(c);return `<div class="persistent-identity"><span>${esc(c.id)} · ${esc(c.repo)} · ${esc(c.branch)}</span><span>PR ${esc(c.pr)} · ticket ${esc(c.ticket)}</span><span>Candidate ${esc(c.candidate)} · spec gen ${c.generation}</span><div class="link-list"><span class="example-link">PR / branch / ticket · examples, not live links</span><button class="btn" data-campaign="${campaign.id}">Campaign · ${esc(campaign.title)}</button><a class="btn" href="spec.html#acceptance-obligations" target="_blank" rel="noopener">Specification</a><span class="example-link">Preview · no live URL supplied</span></div><span class="dim">OpenCode Session ${esc(c.session)} · exact ID shown; no live deep link supplied</span></div>`}
  function renderInspector(){const mq=window.matchMedia('(max-width: 1050px)').matches;app.dataset.mobile=String(mq);inspector.hidden=mq&&!model.inspectorOpen;const back=`<button class="btn inspector-back" data-action="back">← Back to ${model.section==='campaigns'?'Campaigns':model.section==='operations'?'Operations':'Inbox'}</button>`;let head='',body='',tabs='';if(model.section==='campaigns'){const c=campaigns[model.campaign]||campaigns['camp-runtime'];head=`${back}<div class="inspector-tools"><span class="eyebrow">CAMPAIGN INSPECTOR</span><button class="btn" data-expand>Expand workbench</button></div><h2 class="inspector-title">${esc(c.title)}</h2><p class="muted">${esc(c.id)} · sample projection</p>`;body=campaignInspector(c);}else if(model.section==='settings'){head=`${back}<div class="inspector-tools"><span class="eyebrow">EFFECTIVE CONFIGURATION</span></div><h2 class="inspector-title">Attempt configuration</h2>`;body='<div class="panel"><h3>Change policy</h3><p class="muted">Provider/model, MCP, skills/plugins and worker defaults apply to new Attempts by default. Existing Attempts retain their effective configuration until explicit upgrade or steering.</p><div class="callout">This reference inspector does not apply settings to a running worker.</div></div>';}else{const c=commissions[model.commission]||commissions.c14;head=`${back}<div class="inspector-tools"><label class="resize-control">Inspector <input id="inspectorResize" type="range" min="320" max="560" step="10" value="${parseInt(getComputedStyle(app).getPropertyValue('--inspector'))||390}" aria-label="Resize inspector"></label><button class="btn" data-expand>${model.expanded?'Collapse workbench':'Expand workbench'}</button></div><label class="muted">Sample Commission<select class="control" id="scenarioSelect">${Object.values(commissions).map(x=>`<option value="${x.key}" ${x.key===c.key?'selected':''}>${esc(x.id)} · ${esc(x.title)} · ${esc(x.statusLabel)}</option>`).join('')}</select></label><h2 class="inspector-title">${esc(c.title)}</h2><span class="state ${stateClass(c)}">${esc(c.statusLabel)}</span>${renderIdentity(c)}`;tabs=`<div class="tabs" role="tablist" aria-label="Inspector views">${tabButtons()}</div>`;body=tabContent(c)+renderCommand(c);}
    inspector.innerHTML=`<div class="inspector-head">${head}</div>${tabs}<div class="inspector-body">${body}</div>`;inspector.hidden=mq&&!model.inspectorOpen;app.dataset.inspectorOpen=String(model.inspectorOpen);app.classList.toggle('workbench-expanded',model.expanded);if(model.section!=='campaigns'&&model.section!=='settings'){const form=document.getElementById('mockActionForm');if(form){const action=document.getElementById("actionKind");action.value=model.actionKind;actionFields(commissions[model.commission]);}}}
  function renderPrimary(){if(model.section==='inbox')renderInbox();else if(model.section==='campaigns')renderCampaigns();else if(model.section==='operations')renderOperations();else renderSettings();}
  function render(){app.dataset.section=model.section;app.dataset.inspectorOpen=String(model.inspectorOpen);document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===model.section?'page':'false'));const crumb={inbox:'/ Inbox / '+(model.mode==='focused'?'Focused':'Everything'),campaigns:'/ Campaigns / '+(campaigns[model.campaign]?.title||'Campaign'),operations:'/ Operations / '+model.opsTab[0].toUpperCase()+model.opsTab.slice(1),settings:'/ Settings'};document.getElementById('breadcrumbs').textContent=crumb[model.section];renderPrimary();renderInspector();}
  function navigate(section,extra={}){model.expanded=false;model.inspectorOpen=false;Object.assign(model,{section},extra);const hash=routeHash();history.pushState(null,'',hash);render();}
  function applyHash(){const p=parseHash();Object.assign(model,p);model.inspectorOpen=!!p.inspectorOpen;model.expanded=false;render();}
  function chooseCommission(key){if(!commissions[key])return;const section=model.section==='operations'?'operations':'inbox';model.commission=key;model.tab='overview';model.inspectorOpen=true;model.expanded=false;go({section,mode:section==='inbox'?'everything':model.mode,commission:key,tab:'overview',inspectorOpen:true});}
  function renderFiltersSafe(){renderInboxRows();renderFilters();}
  document.addEventListener('input',e=>{if(e.target.id==='inboxSearch'){model.search=e.target.value;renderInboxRows()}if(e.target.id==='campaignSearch'){model.campaignSearch=e.target.value;renderCampaignRows()}});
  document.addEventListener('change',e=>{if(e.target.dataset.filter){const set=e.target.dataset.filter==='repo'?model.filterRepo:model.filterState;e.target.checked?set.add(e.target.value):set.delete(e.target.value);renderFiltersSafe()}if(e.target.id==='scenarioSelect')chooseCommission(e.target.value);if(e.target.id==='actionKind')actionFields(commissions[model.commission]);if(e.target.id==='inspectorResize')app.style.setProperty('--inspector',e.target.value+'px');if(e.target.id==='providerSelect')model.settings.provider=e.target.value;if(e.target.id==='modelSelect')model.settings.model=e.target.value;if(e.target.id==='runtimeSelect')model.settings.runtime=e.target.value;if(e.target.id==='budgetSelect')model.settings.budget=e.target.value;if(e.target.dataset.config)model.settings[e.target.dataset.config]=e.target.checked});
  document.addEventListener('change',e=>{if(e.target.id==='actionKind')model.actionKind=e.target.value});
  document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){e.preventDefault();navigate(nav.dataset.nav,nav.dataset.nav==='operations'?{opsTab:'fleet'}:{});return}const commission=e.target.closest('[data-commission]');if(commission){chooseCommission(commission.dataset.commission);return}const camp=e.target.closest('[data-campaign]');if(camp){model.campaign=camp.dataset.campaign;model.inspectorOpen=true;go({section:'campaigns',campaign:camp.dataset.campaign,inspectorOpen:true});return}const mode=e.target.closest('[data-mode]');if(mode){go({section:'inbox',mode:mode.dataset.mode});return}const tab=e.target.closest('[data-inspector-tab]');if(tab){model.tab=tab.dataset.inspectorTab;go({tab:model.tab});return}const op=e.target.closest('[data-ops-tab]');if(op){go({section:'operations',opsTab:op.dataset.opsTab});return}const remove=e.target.closest('[data-remove-filter]');if(remove){(remove.dataset.removeFilter==='repo'?model.filterRepo:model.filterState).delete(remove.dataset.value);renderInbox();return}if(e.target.closest('[data-clear-filters]')){model.filterRepo.clear();model.filterState.clear();renderInbox();return}if(e.target.closest('[data-expand]')){model.expanded=!model.expanded;if(model.expanded)model.tab='diff';renderInspector();return}if(e.target.closest('[data-action="back"]')){model.inspectorOpen=false;model.expanded=false;go({inspectorOpen:false,expanded:false});return}const setting=e.target.closest('[data-setting]');if(setting){const messages={"save-defaults":"MOCK ONLY — settings preview changed for new Attempts.","save-extensions":"MOCK ONLY — extension settings preview changed.","save-worker":"MOCK ONLY — worker defaults preview changed for new work.","upgrade-active":"MOCK ONLY — explicit upgrade request shown; no active Attempt changed."};model.settingsMessage=messages[setting.dataset.setting]||'MOCK ONLY';renderSettings();return}});
  document.addEventListener('submit',e=>{if(e.target.id!=='mockActionForm')return;e.preventDefault();const c=commissions[model.commission],kind=document.getElementById('actionKind').value;let message='MOCK ONLY — local action simulated; nothing was sent.';if(kind==='authorize'){const sha=document.getElementById('authCandidate')?.value.trim(),gen=Number(document.getElementById('authGeneration')?.value),fresh=document.getElementById('authFresh')?.checked;if(c.status!=='review'||!fresh||sha!==c.candidate||gen!==c.generation||!c.reviewCurrent)message='Blocked in mock: refresh review readiness, Candidate SHA and specification generation before authorization.';else message=`MOCK ONLY — integration authorization simulated for ${sha} · spec generation ${gen}. No command sent.`}else if(kind==='answer'&&!c.question)message='No controller-admitted question exists for this selected sample.';else if(kind==='intervention'&&c.status!=='watchdog')message='MOCK ONLY — intervention request simulated; this sample has no watchdog stall.';else if(kind==='intervention')message='MOCK ONLY — intervention request recorded locally against the existing watchdog observation; no command sent.';else if(kind==='amendment')message=`MOCK ONLY — versioned amendment proposal recorded locally for generation ${c.generation+1}; not approved or sent.`;else if(kind==='answer')message='MOCK ONLY — answer choice recorded locally for the admitted sample question; no command sent.';else message='MOCK ONLY — implementation guidance queued in local example activity; no command sent.';model.actionMessages[c.key]=[...(model.actionMessages[c.key]||[]),message];renderInspector()});
  window.addEventListener('hashchange',applyHash);window.addEventListener('popstate',applyHash);window.addEventListener('resize',renderInspector);
  const initial=parseHash();Object.assign(model,initial);if(!location.hash)history.replaceState(null,'',routeHash());render();
})();
</script>
