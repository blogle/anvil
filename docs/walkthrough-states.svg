<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a828e"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#14161a"/>
  <text x="30" y="40" font-size="12" fill="#7a828e">COMMISSION STATE MACHINE — every transition engine.rs apply() permits, edges labeled with their Transition variant</text>

  <!-- pending → active → needs-review → merged : the main axis -->
  <rect x="50" y="218" width="130" height="44" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="115" y="245" font-size="13" font-weight="bold" fill="#d7dae0" text-anchor="middle">pending</text>

  <rect x="300" y="218" width="130" height="44" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="365" y="245" font-size="13" font-weight="bold" fill="#7ee787" text-anchor="middle">active</text>

  <rect x="560" y="218" width="160" height="44" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="640" y="245" font-size="13" font-weight="bold" fill="#79c0ff" text-anchor="middle">needs-review</text>

  <rect x="830" y="218" width="100" height="44" rx="6" fill="#191c21" stroke="#2a2e35" stroke-dasharray="4 3"/>
  <text x="880" y="245" font-size="13" font-weight="bold" fill="#7a828e" text-anchor="middle">merged</text>

  <!-- interactive : pause/resume -->
  <rect x="300" y="78" width="130" height="44" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="365" y="105" font-size="13" font-weight="bold" fill="#e3b341" text-anchor="middle">interactive</text>

  <!-- escalated : escalate/retry -->
  <rect x="300" y="358" width="130" height="44" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="365" y="385" font-size="13" font-weight="bold" fill="#f0883e" text-anchor="middle">escalated</text>

  <!-- failed : fail/requeue/retry -->
  <rect x="170" y="358" width="140" height="44" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="240" y="385" font-size="13" font-weight="bold" fill="#ff7b72" text-anchor="middle">failed</text>

  <!-- cancelled : terminal -->
  <rect x="830" y="358" width="100" height="44" rx="6" fill="#191c21" stroke="#2a2e35" stroke-dasharray="4 3"/>
  <text x="880" y="385" font-size="13" font-weight="bold" fill="#7a828e" text-anchor="middle">cancelled</text>

  <!-- main-axis edges -->
  <path d="M180,240 L296,240" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="238" y="232" font-size="10" fill="#7a828e" text-anchor="middle">Admit</text>

  <path d="M430,240 L556,240" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="493" y="232" font-size="10" fill="#7a828e" text-anchor="middle">Converge</text>

  <path d="M720,240 L826,240" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="773" y="232" font-size="10" fill="#7a828e" text-anchor="middle">Merge</text>

  <!-- reopen : needs-review back to active, over the top -->
  <path d="M610,218 C600,155 345,155 355,218" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="505" y="148" font-size="10" fill="#7a828e" text-anchor="middle">Reopen · head moved · checks regress</text>

  <!-- pause / resume -->
  <path d="M340,218 L340,126" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="322" y="180" font-size="10" fill="#7a828e" text-anchor="end">Pause</text>

  <path d="M390,122 L390,214" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="402" y="180" font-size="10" fill="#7a828e" text-anchor="start">Resume · re-baseline</text>

  <!-- escalate / retry -->
  <path d="M340,262 L340,354" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="322" y="300" font-size="10" fill="#7a828e" text-anchor="end">Escalate</text>
  <text x="322" y="312" font-size="10" fill="#7a828e" text-anchor="end">budgets · stalls</text>
  <text x="322" y="324" font-size="10" fill="#7a828e" text-anchor="end">gap loop</text>

  <path d="M390,358 L390,266" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="402" y="300" font-size="10" fill="#7a828e" text-anchor="start">Retry</text>

  <!-- fail : pending and active into failed -->
  <path d="M150,262 L200,354" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="140" y="312" font-size="10" fill="#7a828e" text-anchor="middle">Fail · env</text>

  <path d="M310,262 L260,354" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="308" y="312" font-size="10" fill="#7a828e" text-anchor="middle">Fail · env</text>

  <!-- requeue : failed back to pending -->
  <path d="M170,380 C90,380 90,280 115,266" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="85" y="330" font-size="10" fill="#7a828e" text-anchor="middle">Requeue</text>

  <!-- retry : failed back to active -->
  <path d="M310,380 L420,266" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="340" font-size="10" fill="#7a828e" text-anchor="middle">Retry</text>

  <!-- cancel : from any non-terminal -->
  <text x="650" y="474" font-size="10" fill="#7a828e" text-anchor="end">any non-terminal</text>
  <path d="M660,470 L826,392" stroke="#7a828e" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="740" y="448" font-size="10" fill="#7a828e" text-anchor="middle">Cancel</text>

  <!-- merge note -->
  <text x="800" y="292" font-size="10" fill="#7a828e" text-anchor="middle">Merge is also legal from active · interactive · escalated · failed</text>

  <!-- footer -->
  <text x="30" y="560" font-size="11" fill="#7a828e">merged and cancelled are walls — apply() has no match arms for them, so the compiler enforces terminality · Escalate is also legal from needs-review</text>
</svg>
