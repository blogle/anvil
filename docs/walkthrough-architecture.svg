<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a828e"/>
    </marker>
  </defs>
  <rect width="960" height="640" fill="#14161a"/>
  <text x="30" y="40" font-size="12" fill="#7a828e">ANVIL WORKSPACE — five crates, one control plane, and the world they talk to</text>

  <!-- left column: clients -->
  <rect x="30" y="80" width="210" height="84" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="46" y="110" font-size="14" font-weight="bold" fill="#79c0ff">anvil</text>
  <text x="46" y="128" font-size="11" fill="#d7dae0">operator CLI</text>
  <text x="46" y="146" font-size="11" fill="#7a828e">clap · reqwest · small tree</text>

  <rect x="30" y="210" width="210" height="84" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="46" y="240" font-size="14" font-weight="bold" fill="#e3b341">anvilctl</text>
  <text x="46" y="258" font-size="11" fill="#d7dae0">sandbox signal CLI</text>
  <text x="46" y="276" font-size="11" fill="#7a828e">done · attention</text>

  <rect x="30" y="470" width="210" height="84" rx="6" fill="#191c21" stroke="#2a2e35" stroke-dasharray="4 3"/>
  <text x="46" y="500" font-size="14" font-weight="bold" fill="#7ee787">anvil-api</text>
  <text x="46" y="518" font-size="11" fill="#d7dae0">wire types of record</text>
  <text x="46" y="536" font-size="11" fill="#7a828e">ids · states · events</text>

  <!-- middle: anvild -->
  <rect x="300" y="70" width="360" height="500" rx="6" fill="#171a1f" stroke="#3a3f47"/>
  <text x="320" y="100" font-size="14" font-weight="bold" fill="#d7dae0">anvild</text>
  <text x="382" y="100" font-size="11" fill="#7a828e">— the control plane · all heavy deps live here</text>

  <rect x="320" y="140" width="280" height="36" rx="4" fill="#191c21" stroke="#2a2e35"/>
  <text x="334" y="163" font-size="12" font-weight="bold" fill="#d7dae0">http</text>
  <text x="378" y="163" font-size="11" fill="#7a828e">REST + SSE + /v1/signals</text>

  <rect x="320" y="186" width="280" height="36" rx="4" fill="#191c21" stroke="#79c0ff"/>
  <text x="334" y="209" font-size="12" font-weight="bold" fill="#79c0ff">engine</text>
  <text x="390" y="209" font-size="11" fill="#7a828e">the cadence tick — orchestration</text>

  <rect x="320" y="232" width="280" height="36" rx="4" fill="#191c21" stroke="#2a2e35"/>
  <text x="334" y="255" font-size="12" font-weight="bold" fill="#d7dae0">strategy</text>
  <text x="406" y="255" font-size="11" fill="#7a828e">compose prompt · evaluate</text>

  <rect x="320" y="278" width="280" height="36" rx="4" fill="#191c21" stroke="#2a2e35"/>
  <text x="334" y="301" font-size="12" font-weight="bold" fill="#d7dae0">harness</text>
  <text x="406" y="301" font-size="11" fill="#7a828e">opencode serve adapter</text>

  <rect x="320" y="324" width="280" height="36" rx="4" fill="#191c21" stroke="#2a2e35"/>
  <text x="334" y="347" font-size="12" font-weight="bold" fill="#d7dae0">sandbox</text>
  <text x="412" y="347" font-size="11" fill="#7a828e">podman | memory providers</text>

  <rect x="320" y="370" width="280" height="36" rx="4" fill="#191c21" stroke="#2a2e35"/>
  <text x="334" y="393" font-size="12" font-weight="bold" fill="#d7dae0">github</text>
  <text x="398" y="393" font-size="11" fill="#7a828e">branch · draft PR · checks</text>

  <rect x="320" y="416" width="280" height="36" rx="4" fill="#191c21" stroke="#2a2e35"/>
  <text x="334" y="439" font-size="12" font-weight="bold" fill="#d7dae0">store</text>
  <text x="384" y="439" font-size="11" fill="#7a828e">SQLite WAL · events · attention</text>

  <rect x="320" y="462" width="280" height="36" rx="4" fill="#191c21" stroke="#2a2e35"/>
  <text x="334" y="485" font-size="12" font-weight="bold" fill="#d7dae0">secrets</text>
  <text x="406" y="485" font-size="11" fill="#7a828e">ChaCha20-Poly1305 at rest</text>

  <!-- right column: the world — ordered to match the anvild module stack,
       so every arrow is a short hop with no crossings -->
  <rect x="720" y="80" width="210" height="64" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="736" y="106" font-size="12" font-weight="bold" fill="#d2a8ff">opencode serve</text>
  <text x="736" y="126" font-size="11" fill="#7a828e">in-sandbox harness · :4096</text>

  <rect x="720" y="190" width="210" height="64" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="736" y="216" font-size="12" font-weight="bold" fill="#f0883e">podman / k8s Sandbox</text>
  <text x="736" y="236" font-size="11" fill="#7a828e">one sandbox per commission</text>

  <rect x="720" y="300" width="210" height="64" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="736" y="326" font-size="12" font-weight="bold" fill="#ff7b72">GitHub App API</text>
  <text x="736" y="346" font-size="11" fill="#7a828e">tokens · branch · PR · checks</text>

  <rect x="720" y="410" width="210" height="64" rx="6" fill="#191c21" stroke="#2a2e35"/>
  <text x="736" y="436" font-size="12" font-weight="bold" fill="#7ee787">SQLite (WAL)</text>
  <text x="736" y="456" font-size="11" fill="#7a828e">~/.local/state/anvil/anvil.db</text>

  <rect x="720" y="520" width="210" height="64" rx="6" fill="#191c21" stroke="#2a2e35" stroke-dasharray="4 3"/>
  <text x="736" y="546" font-size="12" font-weight="bold" fill="#79c0ff">anvil-router</text>
  <text x="736" y="566" font-size="11" fill="#7a828e">own binary · watches labels</text>

  <!-- arrows -->
  <path d="M240,122 L296,122" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="243" y="112" font-size="10" fill="#7a828e">HTTP+SSE</text>

  <path d="M240,252 L296,252" stroke="#7a828e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="243" y="242" font-size="10" fill="#7a828e">token</text>

  <path d="M600,296 L716,112" stroke="#d2a8ff" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="610" y="186" font-size="10" fill="#d2a8ff">run_turn</text>

  <path d="M600,342 L716,222" stroke="#f0883e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="610" y="272" font-size="10" fill="#f0883e">SandboxProvider</text>

  <path d="M600,388 L716,332" stroke="#ff7b72" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="612" y="356" font-size="10" fill="#ff7b72">poll</text>

  <path d="M600,434 L716,442" stroke="#7ee787" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="612" y="428" font-size="10" fill="#7ee787">sqlx</text>

  <path d="M330,570 C330,590 275,590 275,566 L246,566" stroke="#7ee787" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="240" y="456" font-size="10" fill="#7ee787">types ↘</text>

  <path d="M135,164 L135,466" stroke="#7a828e" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="142" y="330" font-size="10" fill="#7a828e">dev</text>

  <path d="M930,552 L944,552 L944,222 L932,222" stroke="#79c0ff" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="950" y="400" font-size="10" fill="#79c0ff" transform="rotate(90 950 400)">watches labels</text>

  <!-- footer -->
  <text x="30" y="618" font-size="11" fill="#7a828e">solid arrows = runtime calls · dashed = compile-time (types) or out-of-band · drift note: anvil-router is a stub in this tree (src/main.rs is `fn main() {}`)</text>
</svg>
