[workspace]
resolver = "2"
members = [
  "crates/anvil-core",
  # Reserved for the service crates owned by the other delegates.
  "crates/anvild",
  "crates/anvil-mcp",
  "crates/anvil-router",
  "crates/anvilctl",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.ci]
inherits = "dev"
incremental = false
opt-level = 0
codegen-units = 256
debug = "line-tables-only"

[profile.ci-release]
inherits = "release"
opt-level = 1
incremental = false
codegen-units = 256
lto = false
debug = false

[workspace.dependencies]
anvil-core = { path = "crates/anvil-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
getrandom = "0.2"
uuid = { version = "1.11", features = ["serde", "v4"] }
url = { version = "2.5", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
