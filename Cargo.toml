[workspace]
resolver = "2"
members = [
    "crates/anvil",
    "crates/anvil-api",
    "crates/anvilctl",
    "crates/anvil-router",
    "crates/anvild",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
