[workspace]
resolver = "2"
members = [
    "crates/anvil",
    "crates/anvil-api",
    "crates/anvilctl",
    "crates/anvil-router",
    "crates/anvild",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
chacha20poly1305 = "0.10"
dotenvy = "0.15"
getrandom = "0.3"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "fs", "process", "net"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
